<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star at Night — Upload Photos, We Make Gifts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #090D10;
      --paper: #F5F0E7;
      --paper-warm: #FAF7F1;
      --paper-deep: #E9E0D2;
      --ink: #27241F;
      --ink-soft: #6F685F;
      --star: #E3B45D;
      --star-light: #F2D696;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--night);
      color: var(--paper);
      min-height: 100vh;
    }

    /* Hero */
    .hero {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .hero__star {
      width: 100px;
      height: 100px;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
    }

    .hero__title {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(2.5rem, 6vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }

    .hero__title em {
      color: var(--star-light);
      font-style: italic;
    }

    .hero__sub {
      font-size: 1.1rem;
      color: rgba(245, 240, 231, 0.6);
      margin-bottom: 2.5rem;
      max-width: 400px;
    }

    /* Upload Zone */
    .upload-zone {
      width: 100%;
      max-width: 500px;
      border: 2px dashed rgba(245, 240, 231, 0.2);
      border-radius: 20px;
      padding: 3rem 2rem;
      cursor: pointer;
      transition: all 0.3s var(--ease);
      position: relative;
    }

    .upload-zone:hover {
      border-color: var(--star);
      background: rgba(227, 180, 93, 0.05);
    }

    .upload-zone.dragover {
      border-color: var(--star);
      background: rgba(227, 180, 93, 0.1);
      transform: scale(1.02);
    }

    .upload-zone__icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .upload-zone__text {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    .upload-zone__hint {
      font-size: 0.85rem;
      color: rgba(245, 240, 231, 0.4);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* Photo Grid */
    .photos {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 2rem;
      max-width: 500px;
    }

    .photo {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      object-fit: cover;
      opacity: 0;
      animation: photoIn 0.4s var(--ease) forwards;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    /* Generate Button */
    .generate-btn {
      margin-top: 2rem;
      padding: 1rem 2.5rem;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      background: var(--paper);
      color: var(--ink);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s var(--ease);
    }

    .generate-btn.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(245, 240, 231, 0.2);
    }

    .generate-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Loading */
    .loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-top: 2rem;
    }

    .loading.active {
      display: flex;
    }

    .loading__star {
      width: 48px;
      height: 48px;
      animation: pulse 2s ease-in-out infinite;
    }

    .loading__text {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: rgba(245, 240, 231, 0.7);
    }

    /* Results */
    .results {
      display: none;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .results.active {
      display: block;
    }

    .results__title {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(1.5rem, 3vw, 2.5rem);
      text-align: center;
      margin-bottom: 2rem;
    }

    .results__grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: var(--paper);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s var(--ease);
      opacity: 0;
      transform: translateY(20px);
    }

    .product-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    }

    .product-card__image {
      aspect-ratio: 4/5;
      background: var(--paper-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .product-card__image img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .product-card__badge {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: var(--ink);
      color: var(--paper);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
    }

    .product-card__body {
      padding: 1.25rem;
    }

    .product-card__title {
      font-family: 'Instrument Serif', serif;
      font-size: 1.25rem;
      color: var(--ink);
      margin-bottom: 0.25rem;
    }

    .product-card__desc {
      font-size: 0.85rem;
      color: var(--ink-soft);
      margin-bottom: 1rem;
    }

    .product-card__made {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      text-transform: uppercase;
    }

    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 100;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      transition: background 0.3s var(--ease);
    }

    .header.scrolled {
      background: rgba(9, 13, 16, 0.9);
      backdrop-filter: blur(10px);
    }

    .header__star {
      color: var(--star);
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes photoIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Mobile */
    @media (max-width: 640px) {
      .results__grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <span class="header__star">✦</span>
    Star at Night
  </header>

  <!-- Hero / Upload -->
  <section class="hero" id="hero">
    <svg class="hero__star" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="40" fill="#E3B45D" opacity="0.15"/>
      <path d="M50 8 L58 38 L88 38 L64 56 L72 86 L50 68 L28 86 L36 56 L12 38 L42 38 Z" fill="#E3B45D"/>
      <circle cx="50" cy="50" r="6" fill="#F2D696"/>
    </svg>

    <h1 class="hero__title">
      Upload some photos.<br>
      We'll make <em>gifts.</em>
    </h1>

    <p class="hero__sub">
      Drop photos of anyone you love. We'll turn them into newspapers, books, ornaments, and puzzles.
    </p>

    <div class="upload-zone" id="uploadZone">
      <div class="upload-zone__icon">+</div>
      <div class="upload-zone__text">Drop photos here or tap to browse</div>
      <div class="upload-zone__hint">JPG, PNG, HEIC — as many as you like</div>
      <input type="file" id="fileInput" multiple accept="image/*">
    </div>

    <div class="photos" id="photoGrid"></div>

    <button class="generate-btn" id="generateBtn">
      Make something special →
    </button>

    <div class="loading" id="loading">
      <svg class="loading__star" viewBox="0 0 100 100" fill="none">
        <path d="M50 8 L58 38 L88 38 L64 56 L72 86 L50 68 L28 86 L36 56 L12 38 L42 38 Z" fill="#E3B45D"/>
        <circle cx="50" cy="50" r="6" fill="#F2D696"/>
      </svg>
      <p class="loading__text" id="loadingText">Looking at your photos...</p>
    </div>
  </section>

  <!-- Results -->
  <section class="results" id="results">
    <h2 class="results__title" id="resultsTitle">We made these for you.</h2>
    <div class="results__grid" id="resultsGrid"></div>
  </section>

  <script>
    const state = {
      photos: [],
      products: []
    };

    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const photoGrid = document.getElementById('photoGrid');
    const generateBtn = document.getElementById('generateBtn');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');
    const results = document.getElementById('results');
    const resultsTitle = document.getElementById('resultsTitle');
    const resultsGrid = document.getElementById('resultsGrid');

    // Drag & drop
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    });

    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('dragover');
    });

    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    function handleFiles(files) {
      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;

        const reader = new FileReader();
        reader.onload = (e) => {
          state.photos.push({
            name: file.name,
            data: e.target.result
          });

          const img = document.createElement('img');
          img.src = e.target.result;
          img.className = 'photo';
          img.alt = file.name;
          photoGrid.appendChild(img);

          if (state.photos.length > 0) {
            generateBtn.classList.add('visible');
          }
        };
        reader.readAsDataURL(file);
      }
    }

    // Generate products
    generateBtn.addEventListener('click', generateProducts);

    async function generateProducts() {
      generateBtn.disabled = true;
      loading.classList.add('active');

      const texts = [
        'Looking at your photos...',
        'Finding the perfect details...',
        'Creating something special...',
        'Almost ready...'
      ];

      let i = 0;
      const interval = setInterval(() => {
        loadingText.textContent = texts[Math.min(i, texts.length - 1)];
        i++;
      }, 1200);

      // Simulate AI generation (replace with real API)
      await new Promise(r => setTimeout(r, 4000));

      clearInterval(interval);

      // Generate mock products using the uploaded photos
      const products = generateMockProducts();
      state.products = products;

      loading.classList.remove('active');
      showResults(products);
    }

    function generateMockProducts() {
      const photo = state.photos[0]?.data || '';
      const name = 'Your loved one';

      return [
        {
          type: 'newspaper',
          title: 'The Times',
          subtitle: `A very special edition about ${name}`,
          badge: 'NEWSPAPER',
          image: photo,
          madeFrom: state.photos.map(p => p.name.split('.')[0]).join(' · ')
        },
        {
          type: 'book',
          title: 'The Biography',
          subtitle: 'An unauthorized account of a life well-lived',
          badge: 'BOOK',
          image: photo,
          madeFrom: state.photos.map(p => p.name.split('.')[0]).join(' · ')
        },
        {
          type: 'ornament',
          title: 'Christmas Ornament',
          subtitle: 'A keepsake for years to come',
          badge: 'ORNAMENT',
          image: photo,
          madeFrom: state.photos.map(p => p.name.split('.')[0]).join(' · ')
        },
        {
          type: 'puzzle',
          title: 'Custom Puzzle',
          subtitle: '500 pieces of memories',
          badge: 'PUZZLE',
          image: photo,
          madeFrom: state.photos.map(p => p.name.split('.')[0]).join(' · ')
        },
        {
          type: 'card',
          title: 'Greeting Card',
          subtitle: 'With a little something inside',
          badge: 'CARD',
          image: photo,
          madeFrom: state.photos.map(p => p.name.split('.')[0]).join(' · ')
        },
        {
          type: 'print',
          title: 'Art Print',
          subtitle: 'Framed and ready to hang',
          badge: 'PRINT',
          image: photo,
          madeFrom: state.photos.map(p => p.name.split('.')[0]).join(' · ')
        }
      ];
    }

    function showResults(products) {
      resultsTitle.textContent = `We made ${products.length} things from your photos.`;
      resultsGrid.innerHTML = '';

      products.forEach((product, i) => {
        const card = document.createElement('article');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-card__image">
            <span class="product-card__badge">${product.badge}</span>
            ${product.image ? `<img src="${product.image}" alt="${product.title}">` : ''}
          </div>
          <div class="product-card__body">
            <h3 class="product-card__title">${product.title}</h3>
            <p class="product-card__desc">${product.subtitle}</p>
            <p class="product-card__made">Made from ${product.madeFrom}</p>
          </div>
        `;

        resultsGrid.appendChild(card);

        // Staggered reveal
        setTimeout(() => {
          card.classList.add('visible');
        }, i * 100);
      });

      results.classList.add('active');
      results.scrollIntoView({ behavior: 'smooth' });
    }

    // Scroll header
    window.addEventListener('scroll', () => {
      document.querySelector('.header').classList.toggle('scrolled', window.scrollY > 50);
    });
  </script>
</body>
</html>
