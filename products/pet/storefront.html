<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star at Night — Make Something for Someone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; }
        
        /* Hero */
        .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; background: radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, #0a0a0f 70%); }
        .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 300; letter-spacing: -0.02em; margin-bottom: 16px; background: linear-gradient(135deg, #f0c27f, #fc5c7d, #6a82fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 1.1rem; color: #888; max-width: 500px; margin-bottom: 40px; }
        
        /* Who selector */
        .who-selector { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px; }
        .who-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 16px 28px; border-radius: 12px; cursor: pointer; font-size: 1rem; transition: all 0.3s; }
        .who-btn:hover, .who-btn.active { background: rgba(255,255,255,0.1); border-color: #fc5c7d; box-shadow: 0 0 20px rgba(252,92,125,0.2); }
        .who-btn .icon { font-size: 1.5rem; display: block; margin-bottom: 8px; }
        
        /* Chat area */
        .chat-container { max-width: 700px; width: 100%; margin: 0 auto; }
        .chat-messages { min-height: 200px; padding: 20px 0; }
        .chat-msg { margin-bottom: 20px; animation: fadeIn 0.5s ease; }
        .chat-msg.bot { display: flex; gap: 12px; }
        .chat-msg.bot .avatar { width: 36px; height: 36px; background: linear-gradient(135deg, #fc5c7d, #6a82fb); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
        .chat-msg.bot .bubble { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px 20px; max-width: 500px; }
        .chat-msg.user { display: flex; justify-content: flex-end; }
        .chat-msg.user .bubble { background: linear-gradient(135deg, #fc5c7d, #6a82fb); border-radius: 16px; padding: 16px 20px; max-width: 500px; }
        
        /* Input */
        .chat-input { display: flex; gap: 12px; padding: 20px 0; position: sticky; bottom: 0; background: #0a0a0f; }
        .chat-input input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px 18px; color: #fff; font-size: 1rem; outline: none; }
        .chat-input input:focus { border-color: #fc5c7d; }
        .chat-input button { background: linear-gradient(135deg, #fc5c7d, #6a82fb); border: none; color: #fff; padding: 14px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        
        /* Photo upload */
        .photo-upload { border: 2px dashed rgba(255,255,255,0.15); border-radius: 16px; padding: 30px; text-align: center; cursor: pointer; margin: 16px 0; transition: border-color 0.3s; }
        .photo-upload:hover { border-color: #fc5c7d; }
        .photo-upload .icon { font-size: 2rem; margin-bottom: 8px; }
        
        /* Results */
        .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin: 30px 0; }
        .result-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden; cursor: pointer; transition: all 0.3s; }
        .result-card:hover { border-color: #fc5c7d; transform: translateY(-4px); box-shadow: 0 8px 30px rgba(252,92,125,0.15); }
        .result-card .img { height: 200px; background: linear-gradient(135deg, rgba(252,92,125,0.2), rgba(106,130,251,0.2)); display: flex; align-items: center; justify-content: center; font-size: 3rem; }
        .result-card .info { padding: 20px; }
        .result-card .price { font-size: 1.3rem; font-weight: 700; color: #fc5c7d; }
        .result-card .desc { color: #888; margin-top: 8px; font-size: 0.9rem; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Footer */
        .footer { text-align: center; padding: 60px 20px; color: #555; border-top: 1px solid rgba(255,255,255,0.05); }
        .footer a { color: #fc5c7d; text-decoration: none; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Make something for someone.</h1>
        <p>Tell us about the person you're gifting to. We'll create something they'll never forget.</p>
        
        <div class="who-selector">
            <button class="who-btn" onclick="selectWho('person')">
                <span class="icon">👤</span> Person
            </button>
            <button class="who-btn" onclick="selectWho('pet')">
                <span class="icon">🐾</span> Pet
            </button>
            <button class="who-btn" onclick="selectWho('couple')">
                <span class="icon">💕</span> Couple
            </button>
            <button class="who-btn" onclick="selectWho('family')">
                <span class="icon">👨‍👩‍👧‍👦</span> Family
            </button>
        </div>
        
        <div class="chat-container" id="chatArea">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="userInput" placeholder="Tell me about them..." onkeypress="if(event.key==='Enter')sendMessage()">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    
    <div class="footer">
        <p>Star at Night © 2026 — Made with AI, for the people you love.</p>
    </div>

    <script>
        let selectedWho = null;
        let conversation = [];
        let context = {};
        
        function selectWho(type) {
            selectedWho = type;
            document.querySelectorAll('.who-btn').forEach(b => b.classList.remove('active'));
            event.target.closest('.who-btn').classList.add('active');
            
            const prompts = {
                person: "Who is this gift for? Tell me their name and a little about them.",
                pet: "Tell me about your pet! What's their name, breed, and what makes them special?",
                couple: "Tell me about the couple. Names, how long together, and a favourite memory.",
                family: "Tell me about your family. Names, who's who, and what makes your family unique."
            };
            
            addBotMessage(prompts[type]);
        }
        
        function addBotMessage(text) {
            const chat = document.getElementById('chatMessages');
            chat.innerHTML += `
                <div class="chat-msg bot">
                    <div class="avatar">✨</div>
                    <div class="bubble">${text}</div>
                </div>`;
            chat.scrollTop = chat.scrollHeight;
        }
        
        function addUserMessage(text) {
            const chat = document.getElementById('chatMessages');
            chat.innerHTML += `
                <div class="chat-msg user">
                    <div class="bubble">${text}</div>
                </div>`;
            chat.scrollTop = chat.scrollHeight;
        }
        
        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            
            addUserMessage(text);
            input.value = '';
            
            // Store context
            if (!context.name && selectedWho) {
                context.name = text.split(' ')[0] || text.split(',')[0];
                context.type = selectedWho;
                
                // Generate response based on context
                setTimeout(() => {
                    addBotMessage(`I love that. ${context.name} sounds wonderful. Would you like me to create something for a specific occasion?`);
                    setTimeout(() => {
                        addBotMessage(`Choose an occasion:<br><br>
                            🎂 Birthday<br>
                            🎄 Christmas<br>
                            💕 Anniversary<br>
                            🏠 New Home<br>
                            ✨ Just Because`);
                    }, 1500);
                }, 800);
            } else if (!context.occasion) {
                context.occasion = text.toLowerCase();
                setTimeout(() => {
                    addBotMessage(`Perfect. I'll create something ${context.occasion} for ${context.name}. Give me a moment to work my magic...`);
                    setTimeout(() => showResults(), 2000);
                }, 800);
            }
        }
        
        function showResults() {
            const chat = document.getElementById('chatMessages');
            chat.innerHTML += `
                <div class="chat-msg bot">
                    <div class="avatar">✨</div>
                    <div class="bubble">Here's what I made for ${context.name}:</div>
                </div>`;
            
            setTimeout(() => {
                const results = getResultsForContext();
                let html = '<div class="results-grid">';
                results.forEach(r => {
                    html += `
                        <div class="result-card" onclick="alert('In production, this would open the checkout for: ${r.title}')">
                            <div class="img">${r.icon}</div>
                            <div class="info">
                                <div class="price">$${r.price}</div>
                                <strong>${r.title}</strong>
                                <div class="desc">${r.desc}</div>
                            </div>
                        </div>`;
                });
                html += '</div>';
                chat.innerHTML += html;
                chat.scrollTop = chat.scrollHeight;
            }, 1000);
        }
        
        function getResultsForContext() {
            const name = context.name || 'them';
            return [
                { icon: '📰', title: `The ${name} Times`, price: 29, desc: 'Personalized newspaper front page' },
                { icon: '🖼️', title: `${name}, Illustrated`, price: 39, desc: 'AI portrait in your chosen style' },
                { icon: '🎮', title: `All About ${name}`, price: 29, desc: 'Custom memory card game' },
                { icon: '🎄', title: `${name} at Christmas`, price: 19, desc: 'Christmas ornament' },
            ];
        }
    </script>
</body>
</html>
