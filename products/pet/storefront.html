<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star at Night — Make Something for Someone</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: #0d0b14; 
            color: #e8e4df; 
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Twinkling stars background */
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle var(--dur) ease-in-out infinite; }
        @keyframes twinkle { 0%, 100% { opacity: var(--min); } 50% { opacity: var(--max); } }
        
        /* Hero */
        .hero { 
            position: relative; z-index: 1;
            min-height: 100vh; 
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            padding: 40px 20px; text-align: center;
            background: radial-gradient(ellipse at 50% 30%, #1a1520 0%, #0d0b14 70%);
        }
        
        /* The Star */
        .star-main {
            width: 60px; height: 60px;
            margin-bottom: 24px;
            animation: starGlow 4s ease-in-out infinite;
        }
        .star-main svg { width: 100%; height: 100%; }
        @keyframes starGlow {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(255,215,0,0.4)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 20px rgba(255,215,0,0.7)); transform: scale(1.05); }
        }
        
        .hero h1 { 
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 4vw, 3rem); 
            font-weight: 400; 
            letter-spacing: -0.01em; 
            margin-bottom: 12px;
            color: #f5f0e8;
        }
        .hero h1 em { 
            font-style: italic; 
            color: #ffd700;
        }
        .hero p { 
            font-size: 1.05rem; 
            color: #8a8078; 
            max-width: 480px; 
            margin-bottom: 40px;
            line-height: 1.6;
        }
        
        /* Who selector */
        .who-selector { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px; }
        .who-btn { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,215,0,0.15); 
            color: #e8e4df; 
            padding: 16px 24px; 
            border-radius: 14px; 
            cursor: pointer; 
            font-size: 0.95rem; 
            font-family: 'Inter', sans-serif;
            transition: all 0.3s; 
        }
        .who-btn:hover, .who-btn.active { 
            background: rgba(255,215,0,0.08); 
            border-color: rgba(255,215,0,0.4); 
            box-shadow: 0 0 24px rgba(255,215,0,0.1); 
        }
        .who-btn .icon { font-size: 1.4rem; display: block; margin-bottom: 6px; }
        
        /* Chat */
        .chat-container { max-width: 680px; width: 100%; margin: 0 auto; }
        .chat-messages { min-height: 180px; padding: 20px 0; }
        .chat-msg { margin-bottom: 18px; animation: fadeIn 0.6s ease; }
        .chat-msg.bot { display: flex; gap: 10px; }
        .chat-msg.bot .avatar { 
            width: 32px; height: 32px; 
            background: linear-gradient(135deg, #ffd700, #ffaa00); 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 0.9rem; flex-shrink: 0;
            box-shadow: 0 0 12px rgba(255,215,0,0.2);
        }
        .chat-msg.bot .bubble { 
            background: rgba(255,215,0,0.04); 
            border: 1px solid rgba(255,215,0,0.1); 
            border-radius: 14px; padding: 14px 18px; 
            max-width: 480px; line-height: 1.6;
            color: #e8e4df;
        }
        .chat-msg.user { display: flex; justify-content: flex-end; }
        .chat-msg.user .bubble { 
            background: rgba(255,215,0,0.1); 
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 14px; padding: 14px 18px; 
            max-width: 480px; color: #f5f0e8;
        }
        
        /* Input */
        .chat-input { display: flex; gap: 10px; padding: 20px 0; position: sticky; bottom: 0; background: #0d0b14; }
        .chat-input input { 
            flex: 1; background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,215,0,0.12); 
            border-radius: 12px; padding: 14px 18px; 
            color: #e8e4df; font-size: 0.95rem; outline: none;
            font-family: 'Inter', sans-serif;
        }
        .chat-input input:focus { border-color: rgba(255,215,0,0.4); }
        .chat-input input::placeholder { color: #5a5550; }
        .chat-input button { 
            background: linear-gradient(135deg, #ffd700, #ffaa00); 
            border: none; color: #1a1520; padding: 14px 22px; 
            border-radius: 12px; font-weight: 600; cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        
        /* Photo upload */
        .photo-upload { 
            border: 2px dashed rgba(255,215,0,0.15); 
            border-radius: 14px; padding: 28px; 
            text-align: center; cursor: pointer; 
            margin: 16px 0; transition: all 0.3s;
            color: #8a8078;
        }
        .photo-upload:hover { border-color: rgba(255,215,0,0.4); color: #e8e4df; }
        .photo-upload .icon { font-size: 1.8rem; margin-bottom: 6px; }
        
        /* Results */
        .results-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); 
            gap: 18px; margin: 28px 0; 
        }
        .result-card { 
            background: rgba(255,215,0,0.03); 
            border: 1px solid rgba(255,215,0,0.1); 
            border-radius: 14px; overflow: hidden; 
            cursor: pointer; transition: all 0.3s; 
        }
        .result-card:hover { 
            border-color: rgba(255,215,0,0.35); 
            transform: translateY(-3px); 
            box-shadow: 0 8px 24px rgba(255,215,0,0.08); 
        }
        .result-card .img { 
            height: 180px; 
            background: linear-gradient(135deg, rgba(255,215,0,0.08), rgba(255,170,0,0.05)); 
            display: flex; align-items: center; justify-content: center; 
            font-size: 2.5rem; 
        }
        .result-card .info { padding: 18px; }
        .result-card .price { font-size: 1.2rem; font-weight: 600; color: #ffd700; }
        .result-card .desc { color: #8a8078; margin-top: 6px; font-size: 0.85rem; line-height: 1.5; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Footer */
        .footer { 
            text-align: center; padding: 50px 20px; 
            color: #5a5550; border-top: 1px solid rgba(255,215,0,0.06);
            position: relative; z-index: 1;
        }
        .footer .star-small { display: inline-block; color: #ffd700; margin-right: 6px; animation: twinkle 3s ease-in-out infinite; }
        .footer a { color: #ffd700; text-decoration: none; }
    </style>
</head>
<body>
    <!-- Twinkling stars -->
    <div class="stars" id="stars"></div>
    
    <div class="hero">
        <!-- The single yellow diamond star -->
        <div class="star-main">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#ffd700"/>
                        <stop offset="50%" style="stop-color:#ffec80"/>
                        <stop offset="100%" style="stop-color:#ffaa00"/>
                    </linearGradient>
                </defs>
                <polygon points="50,5 61,35 95,38 70,60 78,95 50,75 22,95 30,60 5,38 39,35" 
                         fill="url(#starGrad)" opacity="0.9"/>
            </svg>
        </div>
        
        <h1>Make something for <em>someone</em>.</h1>
        <p>Tell us about the person you're gifting to. We'll create something they'll never forget.</p>
        
        <div class="who-selector">
            <button class="who-btn" onclick="selectWho('person')">
                <span class="icon">👤</span> Person
            </button>
            <button class="who-btn" onclick="selectWho('pet')">
                <span class="icon">🐾</span> Pet
            </button>
            <button class="who-btn" onclick="selectWho('couple')">
                <span class="icon">💕</span> Couple
            </button>
            <button class="who-btn" onclick="selectWho('family')">
                <span class="icon">👨‍👩‍👧‍👦</span> Family
            </button>
        </div>
        
        <div class="chat-container" id="chatArea">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="userInput" placeholder="Tell me about them..." onkeypress="if(event.key==='Enter')sendMessage()">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    
    <div class="footer">
        <span class="star-small">✦</span> Star at Night © 2026 — Made with love.
    </div>

    <script>
        // Generate twinkling stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = star.style.height = (Math.random() * 2 + 1) + 'px';
            star.style.setProperty('--dur', (Math.random() * 4 + 2) + 's');
            star.style.setProperty('--min', (Math.random() * 0.2 + 0.1).toString());
            star.style.setProperty('--max', (Math.random() * 0.4 + 0.3).toString());
            star.style.animationDelay = Math.random() * 5 + 's';
            starsContainer.appendChild(star);
        }
        
        let selectedWho = null;
        let context = {};
        
        function selectWho(type) {
            selectedWho = type;
            document.querySelectorAll('.who-btn').forEach(b => b.classList.remove('active'));
            event.target.closest('.who-btn').classList.add('active');
            
            const prompts = {
                person: "Who is this gift for? Tell me their name and a little about them.",
                pet: "Tell me about your pet! What's their name, breed, and what makes them special?",
                couple: "Tell me about the couple. Names, how long together, and a favourite memory.",
                family: "Tell me about your family. Names, who's who, and what makes your family unique."
            };
            
            addBotMessage(prompts[type]);
        }
        
        function addBotMessage(text) {
            const chat = document.getElementById('chatMessages');
            chat.innerHTML += `<div class="chat-msg bot"><div class="avatar">✦</div><div class="bubble">${text}</div></div>`;
            chat.scrollTop = chat.scrollHeight;
        }
        
        function addUserMessage(text) {
            const chat = document.getElementById('chatMessages');
            chat.innerHTML += `<div class="chat-msg user"><div class="bubble">${text}</div></div>`;
            chat.scrollTop = chat.scrollHeight;
        }
        
        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            
            addUserMessage(text);
            input.value = '';
            
            if (!context.name && selectedWho) {
                context.name = text.split(' ')[0] || text.split(',')[0];
                context.type = selectedWho;
                setTimeout(() => {
                    addBotMessage(`I love that. ${context.name} sounds wonderful. Would you like me to create something for a specific occasion?`);
                    setTimeout(() => addBotMessage(`Choose an occasion:<br><br>🎂 Birthday<br>🎄 Christmas<br>💕 Anniversary<br>🏠 New Home<br>✨ Just Because`), 1500);
                }, 800);
            } else if (!context.occasion) {
                context.occasion = text.toLowerCase();
                setTimeout(() => {
                    addBotMessage(`Perfect. I'll create something ${context.occasion} for ${context.name}. Give me a moment to work my magic...`);
                    setTimeout(showResults, 2000);
                }, 800);
            }
        }
        
        function showResults() {
            const chat = document.getElementById('chatMessages');
            chat.innerHTML += `<div class="chat-msg bot"><div class="avatar">✦</div><div class="bubble">Here's what I made for ${context.name}:</div></div>`;
            setTimeout(() => {
                const name = context.name || 'them';
                const results = [
                    { icon: '📰', title: `The ${name} Times`, price: 29, desc: 'Personalized newspaper front page' },
                    { icon: '🖼️', title: `${name}, Illustrated`, price: 39, desc: 'AI portrait in your chosen style' },
                    { icon: '🎮', title: `All About ${name}`, price: 29, desc: 'Custom memory card game' },
                    { icon: '🎄', title: `${name} at Christmas`, price: 19, desc: 'Christmas ornament' },
                ];
                let html = '<div class="results-grid">';
                results.forEach(r => {
                    html += `<div class="result-card"><div class="img">${r.icon}</div><div class="info"><div class="price">$${r.price}</div><strong>${r.title}</strong><div class="desc">${r.desc}</div></div></div>`;
                });
                chat.innerHTML += html;
                chat.scrollTop = chat.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
