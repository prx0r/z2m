[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbuild"
version = "0.3.0"
description = "Aether-orchestrated, sandboxd-backed autonomous web application factory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2,<4"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
agentbuild = "agentbuild.cli:main"
agentbuild-builder-mcp = "agentbuild.mcp.builder:main"
agentbuild-frontier-web-mcp = "agentbuild.mcp.frontier_web:main"
agentbuild-control-mcp = "agentbuild.mcp.control:main"

[tool.setuptools.packages.find]
include = ["agentbuild*"]
