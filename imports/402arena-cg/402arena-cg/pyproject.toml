[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arena402"
version = "0.1.0"
description = "Empirical recommendation and exploration layer for x402 and machine-payable services"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8"]

[project.scripts]
402arena = "arena402.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["arena402"]
