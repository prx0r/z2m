services:
  match_market:
    build: .
    working_dir: /app/01_match_market
    command: uvicorn app:app --host 0.0.0.0 --port 8101
    volumes: ["./01_match_market:/app/01_match_market"]
    ports: ["8101:8101"]
    env_file: .env
  verified_compare:
    build: .
    working_dir: /app/02_verified_compare
