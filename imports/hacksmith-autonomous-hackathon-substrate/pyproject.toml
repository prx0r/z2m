[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hacksmith"
version = "0.1.0"
description = "Judge-driven autonomous hackathon submission substrate"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hacksmith = "hacksmith.cli:main"

[tool.setuptools]
packages = ["hacksmith"]
