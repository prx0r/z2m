[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gift-arbitrage-engine"
version = "0.1.0"
description = "Evidence-weighted personalized gifting opportunity scanner and one-click gift product blueprint engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
giftradar = "giftradar.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
