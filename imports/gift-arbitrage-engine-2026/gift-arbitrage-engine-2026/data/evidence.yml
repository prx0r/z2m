evidence:
  etsy_10k:
    source: Etsy 2025 Form 10-K
    source_type: official
    metric: marketplace personalization + gifting demand
    value: 2025 Etsy marketplace GMS $10.46B; custom/made-to-order ~30% of GMS; 31% of surveyed visits sought custom/personalized
      items and 29% were gift shopping; 86.5M active buyers.
    url: https://investors.etsy.com/sec-filings/all-sec-filings/content/0001370637-26-000019/etsy-20251231.htm
    confidence: 0.98
