[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nordic-ecom-scanner"
version = "0.1.0"
description = "Country × niche × SKU ecommerce arbitrage scanner for Google Shopping-led stores"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "fastapi>=0.116",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
ecomscan = "nordic_arbitrage.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
